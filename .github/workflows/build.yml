name: Сборка Refis для Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать релиз с этой сборкой"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Проверка кода
        run: |
          python -m pyflakes refis tests tools
          for f in refis/static/js/*.js; do node --check "$f"; done
      - name: Тесты
        run: python -m pytest -q

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Версия
        id: ver
        shell: pwsh
        run: |
          $v = (python -c "import refis; print(refis.__version__)").Trim()
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.TrimStart("v") }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Сборка Refis.exe
        run: python tools/build_exe.py

      - name: Самопроверка собранной программы
        shell: pwsh
        run: |
          $env:REFIS_DATA = "$env:RUNNER_TEMP\refis-selftest"
          $p = Start-Process -FilePath "dist\Refis\Refis.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:REFIS_DATA\refis.log" -ErrorAction SilentlyContinue
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\refis.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Портативный архив
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist\Refis\data" | Out-Null
          Compress-Archive -Path "dist\Refis" -DestinationPath "dist\Refis-portable-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Refis-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/Refis-Setup-*.exe
            dist/Refis-portable-*.zip

      - name: Нужен ли релиз
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $want = ("${{ github.ref }}" -eq "refs/heads/main") -or ("${{ github.ref }}" -like "refs/tags/v*") -or ("${{ inputs.publish }}" -eq "true")
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($want -and -not $exists) { "publish=true" >> $env:GITHUB_OUTPUT } else { "publish=false" >> $env:GITHUB_OUTPUT }
          Write-Host "version v$v, want=$want, exists=$exists"

      - name: Описание релиза из CHANGELOG
        if: steps.rel.outputs.publish == 'true'
        run: python tools/changelog_section.py ${{ steps.ver.outputs.version }} > dist/notes.md

      - name: Публикация релиза
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Refis ${{ steps.ver.outputs.version }}
          body_path: dist/notes.md
          target_commitish: ${{ github.sha }}
          files: |
            dist/Refis-Setup-*.exe
            dist/Refis-portable-*.zip
