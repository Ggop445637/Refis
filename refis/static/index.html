<!doctype html>
<html lang="ru">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23e0a35a%22/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refis</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">Refis</div>
    <nav id="views">
      <button data-view="all" class="active">Все файлы <span data-count="all"></span></button>
      <button data-view="ref"><i class="dot k-ref"></i>Референсы</button>
      <button data-view="own"><i class="dot k-own"></i>Мои работы</button>
      <button data-view="tutorial"><i class="dot k-tutorial"></i>Туториалы</button>
      <button data-view="other"><i class="dot k-other"></i>Прочее</button>
      <hr>
      <button data-view="fav">★ Избранное</button>
      <button data-view="untagged">Без тегов</button>
      <button data-view="dupes">Дубликаты</button>
      <button data-view="missing">Пропавшие файлы</button>
    </nav>

    <section>
      <h3>Сохранённые поиски</h3>
      <ul id="saved" class="list"></ul>
    </section>

    <section class="grow">
      <h3>Теги <input id="tagFilter" placeholder="найти тег"></h3>
      <p class="hint">Клик — показать, Alt+клик — исключить, ПКМ — переименовать/удалить</p>
      <ul id="taglist" class="list"></ul>
    </section>

    <section>
      <h3>Папки <button id="addFolder" class="mini" title="Добавить папку">＋</button></h3>
      <ul id="folderlist" class="list"></ul>
    </section>
  </aside>

  <main>
    <header id="toolbar">
      <div class="searchbox">
        <input id="search" type="search" placeholder='Поиск: слова, #тег, -#исключить, -слово' autocomplete="off">
      </div>
      <select id="fType" title="Тип файла">
        <option value="">Фото и видео</option>
        <option value="image">Только фото</option>
        <option value="video">Только видео</option>
      </select>
      <select id="fOrient" title="Ориентация">
        <option value="">Любая ориентация</option>
        <option value="portrait">Вертикальные</option>
        <option value="landscape">Горизонтальные</option>
        <option value="square">Квадратные</option>
      </select>
      <select id="fRating" title="Рейтинг">
        <option value="0">Любой рейтинг</option>
        <option value="1">★ 1+</option>
        <option value="3">★ 3+</option>
        <option value="5">★ 5</option>
      </select>
      <select id="fSort" title="Сортировка">
        <option value="new">Сначала новые</option>
        <option value="old">Сначала старые</option>
        <option value="mtime">По дате файла</option>
        <option value="name">По имени</option>
        <option value="rating">По рейтингу</option>
        <option value="size">По размеру</option>
        <option value="duration">По длительности</option>
        <option value="random">Случайно</option>
      </select>
      <input id="thumbSize" type="range" min="110" max="420" value="200" title="Размер превью">
      <button id="fitToggle" class="ghost" title="Превью: обрезать / целиком">▣</button>
      <button id="saveSearch" class="ghost" title="Сохранить текущий поиск">☆ Сохранить</button>
      <button id="practiceBtn" title="Тренировка набросков по текущей подборке">⏱ Тренировка</button>
    </header>
    <div id="chips"></div>
    <div id="statusbar"><span id="countText"></span><span id="scanText"></span></div>
    <div id="gridwrap">
      <div id="grid"></div>
      <div id="sentinel"></div>
      <div id="empty" hidden></div>
    </div>
  </main>

  <aside id="details"></aside>
</div>

<div id="viewer" class="overlay" hidden>
  <div class="vtop">
    <span id="vTitle"></span>
    <div class="vtools">
      <button data-act="mirror" title="Отзеркалить (H)">⇋ Зеркало</button>
      <button data-act="gray" title="Чёрно-белое (G)">Ч/Б</button>
      <button data-act="blur" title="Размытие для тонового разбора (B)">◍ Пятна</button>
      <button data-act="fit" title="Вписать (0)">⤢</button>
      <span class="vsep vid-only"></span>
      <button data-act="back" class="vid-only" title="Кадр назад (,)">⏮︎ кадр</button>
      <button data-act="fwd" class="vid-only" title="Кадр вперёд (.)">кадр ⏭︎</button>
      <select id="vSpeed" class="vid-only" title="Скорость ([ ])">
        <option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <button data-act="loop" class="vid-only" title="Повтор (L)">↻ Повтор</button>
      <span class="vsep"></span>
      <button data-act="fav" title="В избранное (F)">☆</button>
      <button data-act="close" title="Закрыть (Esc)">✕</button>
    </div>
  </div>
  <div id="vStage" class="stage"></div>
  <div id="vBar" class="vid-only">
    <button id="vPlay" title="Пауза (Пробел)">❚❚</button>
    <input id="vSeek" type="range" min="0" max="1000" value="0">
    <span id="vTime">0:00 / 0:00</span>
    <button id="vMute" title="Звук">🔊</button>
  </div>
  <button class="vnav prev" data-act="prev" title="Назад (←)">‹</button>
  <button class="vnav next" data-act="next" title="Вперёд (→)">›</button>
</div>

<div id="practice" class="overlay" hidden>
  <div class="stage" id="pStage"></div>
  <div class="pbar"><div id="pProgress"></div></div>
  <div class="pcontrols">
    <span id="pCounter"></span>
    <span id="pTime" class="ptime"></span>
    <button data-p="prev" title="Назад (←)">‹</button>
    <button data-p="pause" title="Пауза (Пробел)">❚❚</button>
    <button data-p="next" title="Дальше (→)">›</button>
    <button data-p="mirror" title="Зеркало (H)">⇋</button>
    <button data-p="gray" title="Ч/Б (G)">Ч/Б</button>
    <button data-p="stop" title="Закончить (Esc)">Закончить</button>
  </div>
</div>

<div id="modal" class="overlay modal" hidden><div class="mbox"></div></div>
<div id="dropzone" hidden><div>Отпустите файлы, чтобы добавить их в библиотеку</div></div>
<div id="ctxmenu" hidden></div>
<div id="toast"></div>
<datalist id="tagOptions"></datalist>

<script src="app.js"></script>
</body>
</html>
